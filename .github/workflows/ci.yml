# Clean-environment verification: the same `make setup`, `make build` and `make check-all`
# a developer or Claude Code runs locally (docs/agentic/verification.md).
# One job on purpose — the whole suite runs in about a minute once set up,
# and one job keeps CI identical to the local command.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway database for the authoring-service repository tests, which
    # skip without TEST_DATABASE_URL (CR-051 review: the illustrations_ready SQL
    # was otherwise never run by CI). Same image as docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/*/requirements*.txt

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/orchestrator/go.mod
          cache-dependency-path: services/*/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/*/package-lock.json

      # cairo/pango: build deps of manim (rendering). ffmpeg: video-assembly and
      # rendering tests that need a real binary (installed on dev Macs too).
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg

      - name: make setup
        run: make setup
        env:
          PYTHON: python

      - name: make build
        run: make build

      - name: make check-all
        run: make check-all
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
          TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/ci?sslmode=disable
          # Deselected in CI for now (Creator decision, 2026-09-28): manim and
          # tooth-mockup tests pass locally and may be dropped later. Markers are
          # set in services/rendering/tests/conftest.py; `make check` still runs them.
          PYTEST_ADDOPTS: -m "not manim and not tooth_mockup"

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: ${{ runner.temp }}/check-logs
          retention-days: 7

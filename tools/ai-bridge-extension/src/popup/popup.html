<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConceptFlow AI Bridge</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<nav role="tablist" aria-label="Extension">
  <button type="button" role="tab" id="tab-queue" aria-controls="panel-queue" aria-selected="true">Hàng đợi</button>
  <button type="button" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="false">Cài đặt</button>
</nav>
<section id="panel-queue" role="tabpanel" aria-labelledby="tab-queue">
  <div class="bar">
    <button type="button" id="toggle" class="primary"></button>
    <button type="button" id="clear">Xoá hàng</button>
    <span id="summary" role="status"></span>
  </div>
  <ol id="items"></ol>
  <p id="empty" class="hint">Chưa có mục nào. Ở ConceptFlow, bấm "Thêm vào hàng đợi" cạnh nút "Chạy bằng DeepSeek".</p>
</section>
<section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
  <p class="hint">Khi DeepSeek đổi giao diện, extension cần selector mới. Trang cài đặt đầy đủ cho phép sửa và kiểm tra từng selector trên tab DeepSeek.</p>
  <button type="button" id="open-options" class="primary">Mở cài đặt selector</button>
</section>
<script src="../queue.js"></script>
<script src="popup.js"></script>
</body>
</html>

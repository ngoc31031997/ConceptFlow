server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Docker's socket lists every container on the host, not just this
      # compose project's — keep only ones Compose labeled as ours, so
      # unrelated projects' containers on the same dev machine don't show up.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        regex: "conceptflow"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream

management.load_definitions = /etc/rabbitmq/definitions.json

# A render_scenes job holds its message unacked for the whole Manim render.
# RabbitMQ's default consumer_timeout is 30 minutes, after which it closes the
# channel and redelivers — which for a long render means an endless retry loop
# rather than a failure anyone can see.
#
# Phase 0 benchmarking (long-form-baseline.md) measured a 10-minute video
# rendering in ~4.6 minutes, so the default is not actually being hit today.
# This is headroom for scripts much heavier than the reference fixture, not a
# fix for a live failure. Value is in milliseconds.
consumer_timeout = 3600000

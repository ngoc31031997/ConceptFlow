# Every service below now carries a deploy.resources.limits.memory (rendering
# and video-assembly already had one — RENDER_MEMORY_LIMIT/ASSEMBLY_MEMORY_LIMIT
# predate this). Without a cap, a container is free to grow until it starves
# every other process sharing the Docker VM's RAM — on Docker Desktop that VM
# has a FIXED memory ceiling of its own (Settings > Resources), separate from
# host RAM, and previously only rendering/video-assembly were bounded. Summing
# every default limit below is deliberately > a typical 8G Docker Desktop VM
# (~20G): these are per-container CEILINGS, not reservations, and rendering,
# assembly and ollama rarely peak at the same time — but if the VM's own
# allocation is at or below 8G, raise it (or lower the *_MEMORY_LIMIT vars
# below via .env) before running a render and an assembly concurrently.
# Override any of them per-host via .env, same pattern as .env.window.
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "15672:15672" # Management UI (dev/debug only) — AMQP port 5672 intentionally NOT published to host
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
    deploy:
      resources:
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  tts-db:
    image: postgres:16-alpine
    container_name: tts-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: tts
    volumes:
      - tts_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d tts"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  tts:
    build: ./services/tts
    container_name: tts
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@tts-db:5432/tts
      # ADR-0023 — path to a Google service-account key INSIDE the container.
      # Leave GOOGLE_TTS_CREDENTIALS_FILE unset in .env and every voice uses the
      # Edge engine (ADR-0024), which needs no cloud account at all.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_TTS_CREDENTIALS_FILE:+/run/secrets/google-tts.json}
      # CR-011 — Azure AI Speech. Leave unset and the Azure voices in the
      # catalogue fall back to the identical Edge voice.
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
    deploy:
      resources:
        limits:
          memory: ${TTS_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      tts-db:
        condition: service_healthy
    volumes:
      - shared_artifacts:/shared
      # Mounted read-only; the variable defaults to /dev/null so compose still
      # validates when no key is configured.
      - ${GOOGLE_TTS_CREDENTIALS_FILE:-/dev/null}:/run/secrets/google-tts.json:ro
    networks:
      - backend

  rendering-db:
    image: postgres:16-alpine
    container_name: rendering-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: rendering
    volumes:
      - rendering_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d rendering"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  rendering:
    build: ./services/rendering
    container_name: rendering
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@rendering-db:5432/rendering
      # Defaults below match the original dev machine; override per-host via
      # .env (e.g. .env.window for a weaker CPU where quality still matters
      # more than wall-clock time — see docs/setup/ or ask before lowering
      # RENDER_QUALITY, that's a deliberate per-host quality/time trade-off).
      RENDER_TIMEOUT_SECONDS: "${RENDER_TIMEOUT_SECONDS:-1800}"
      # The validate_script dry pass executes every animation, so a heavy
      # script costs the same order of magnitude as the -ql render it gates.
      # At the old fixed 300s such a script failed here with nothing but a
      # timeout to show for it.
      DRY_RUN_TIMEOUT_SECONDS: "${DRY_RUN_TIMEOUT_SECONDS:-2000}"
      RENDER_MEMORY_LIMIT_GB: "${RENDER_MEMORY_LIMIT_GB:-4}"
      # Manim 0.18 keeps its cache inside media_dir, so this directory is
      # reused per project rather than being a throwaway tempdir. Set it to an
      # empty string to disable caching. Measured 21s -> 4s on an unchanged
      # re-render, 21s -> 6s after editing one narration line.
      RENDER_CACHE_ROOT: "/shared/.manim-media"
      # Fallback quality when a project does not specify one (CR-004). The
      # Creator picks per project in the GUI; this covers projects created
      # before that field existed.
      RENDER_QUALITY: "${RENDER_QUALITY:-1080p60}"
      # Where conceptflow.channel_idents finds the logo for the intro/outro
      # stings (CR-023). Mounted rather than COPYed: the build context is
      # ./services/rendering, so docs/brand/ cannot enter the image without
      # widening the context for every service (H1, cr-016-024-execution-plan).
      BRAND_ASSETS_DIR: "/brand"
      # CR-039 — the compile check llm-service calls (POST /v1/check/*). Same
      # process as the queue consumer, reachable on the backend network only.
      CHECK_HTTP_PORT: "8000"
      CHECK_CONCURRENCY: "${CHECK_CONCURRENCY:-2}"
      TSC_TIMEOUT_SECONDS: "${TSC_TIMEOUT_SECONDS:-90}"
    # Manim renders on every core it can get (Phase 0 measured CPU-time at
    # 2.21x wall-clock), so without a cap a long render starves RabbitMQ and
    # the Postgres instances on the same host. 5G sits just above the 4 GiB
    # RLIMIT_AS the render subprocess is given. Override per-host via .env —
    # e.g. a 4-thread CPU gets no benefit from cpus > 4.
    deploy:
      resources:
        limits:
          cpus: "${RENDER_CPU_LIMIT:-6.0}"
          memory: ${RENDER_MEMORY_LIMIT:-5G}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      rendering-db:
        condition: service_healthy
    volumes:
      - shared_artifacts:/shared
      - ./docs/brand:/brand:ro
    networks:
      - backend

  video-assembly-db:
    image: postgres:16-alpine
    container_name: video-assembly-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: video_assembly
    volumes:
      - video_assembly_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d video_assembly"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  video-assembly:
    build: ./services/video-assembly
    container_name: video-assembly
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@video-assembly-db:5432/video_assembly
      # Override per-host via .env (e.g. .env.window) — a weaker CPU needs a
      # longer ceiling, not a lower crf/preset (those stay quality-first).
      ASSEMBLY_TIMEOUT_SECONDS: "${ASSEMBLY_TIMEOUT_SECONDS:-900}"
      # CR-005 FR14.5 — silence before the first line and after the last.
      # Off by default: padding either end forces a full re-encode (tpad
      # repaints frames), and Phase 0 measured stream copy at 250x faster.
      ASSEMBLY_LEAD_IN_SECONDS: "0"
      ASSEMBLY_TAIL_SECONDS: "0"
      # CR-021 FR61.5 — ngưỡng chấm QC. Mọi biến QC_* đều có mặc định trong
      # domain/qc_rules.py::QCThresholds; liệt kê ở đây để biết chỗ mà siết.
      #
      # Rủi ro số một của CR-021 là báo động giả: QC kêu ở video vốn ổn thì
      # Creator bỏ qua báo cáo và cổng chặn thành hình thức. Nên mặc định nới
      # rộng, chạy chỉ-báo (QC_ENFORCE ở orchestrator, không ở đây), đo trên
      # video thật rồi siết dần bằng các biến dưới.
      #
      # QC_MIN_TEXT_PIXEL_HEIGHT: "24"      # sàn đọc được trên màn 5,5 inch
      # QC_MIN_CONTRAST_RATIO: "3.0"        # WCAG AA cho chữ lớn
      # QC_MAX_STATIC_SECONDS: "12"         # hình đứng yên bao lâu thì kêu
      # QC_TEXT_OVERLAP_MIN_RATIO: "0.15"   # tỉ lệ giao mới coi là chồng lấn
      # QC_SAFE_MARGIN: "0.6"               # theo theme.py, đổi cùng nhau
      # QC_LOUDNESS_TOLERANCE_LU: "1.5"     # lệch -14 LUFS bao nhiêu thì kêu
      # QC_NARRATION_OVERLAP_TOLERANCE_SECONDS: "0.15"
    # x264 is even more parallel than Manim (Phase 0 measured 5.6x CPU-time
    # over wall-clock when burning subtitles), so it needs a cap for the same
    # reason. Peak RSS measured at ~1 GB.
    deploy:
      resources:
        limits:
          cpus: "${ASSEMBLY_CPU_LIMIT:-6.0}"
          memory: ${ASSEMBLY_MEMORY_LIMIT:-3G}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      video-assembly-db:
        condition: service_healthy
    volumes:
      - shared_artifacts:/shared
    networks:
      - backend

  publisher-db:
    image: postgres:16-alpine
    container_name: publisher-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: publisher
    volumes:
      - publisher_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d publisher"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  publisher:
    build: ./services/publisher
    container_name: publisher
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@publisher-db:5432/publisher
      GOOGLE_OAUTH_CLIENT_SECRETS_DIR: /run/secrets/google-oauth
      # Legacy single-app fallback (CR-012 FR29.3) — used only when the
      # secrets directory holds no client_secret*.json.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      UPLOAD_TIMEOUT_SECONDS: "600"
    deploy:
      resources:
        limits:
          memory: ${PUBLISHER_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      publisher-db:
        condition: service_healthy
    volumes:
      - shared_artifacts:/shared:ro
      # Read-only: the Publisher only ever reads client secrets, and a
      # compromised container must not be able to rewrite them (CR-012 FR35.2).
      - ./secrets:/run/secrets/google-oauth:ro
    networks:
      - backend

  orchestrator-db:
    image: postgres:16-alpine
    container_name: orchestrator-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: orchestrator
    volumes:
      - orchestrator_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  orchestrator:
    build: ./services/orchestrator
    container_name: orchestrator
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@orchestrator-db:5432/orchestrator
      OUTBOX_POLL_INTERVAL_MS: "500"
      DATABASE_MAX_CONNS: "10"
      # CR-040 FR111 — prompts, the 1a/1b/1c chain and every language-model call
      # live in authoring-service. The orchestrator reaches it only for the topic
      # search, list summaries, a fork's copy and cleanup after a delete.
      AUTHORING_SERVICE_URL: http://authoring-service:8000
      AUTHORING_SERVICE_TIMEOUT_SECONDS: ${AUTHORING_SERVICE_TIMEOUT_SECONDS:-10}
      # CR-021 Quyết định #3 — cổng chặn publish, TẮT ở giai đoạn đầu.
      #
      # Tắt không có nghĩa là QC không chạy: báo cáo vẫn được chấm đầy đủ và
      # vẫn mang severity thật, chỉ là lỗi blocking không chặn đăng video. Đây
      # là cách duy nhất hiệu chỉnh ngưỡng — bật cổng trước khi biết tỉ lệ báo
      # động giả là cách làm Creator mất niềm tin vào báo cáo.
      #
      # Bật sau khi đã soi báo cáo trên vài video thật: QC_ENFORCE: "true".
      QC_ENFORCE: "${QC_ENFORCE:-false}"
    deploy:
      resources:
        limits:
          memory: ${ORCHESTRATOR_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      orchestrator-db:
        condition: service_healthy
    networks:
      - backend

  # CR-040 FR111 — the prompt library, the 1a/1b/1c authoring chain, metadata and
  # short-script suggestions, and the LLM usage log. Own database; project data
  # (status, settings, formats, journal) is read from the orchestrator over HTTP.
  authoring-service-db:
    image: postgres:16-alpine
    container_name: authoring-service-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: authoring
    volumes:
      - authoring_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d authoring"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  authoring-service:
    build: ./services/authoring-service
    container_name: authoring-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@authoring-service-db:5432/authoring
      DATABASE_MAX_CONNS: "10"
      ORCHESTRATOR_URL: http://orchestrator:8000
      LLM_SERVICE_URL: http://llm-service:8000
      LLM_SERVICE_TIMEOUT_SECONDS: ${LLM_SERVICE_TIMEOUT_SECONDS:-0} # 0 = no timeout
      HIVE_MODEL: ${HIVE_MODEL:-deepseek-ai/deepseek-v4.1-flash}
      HIVE_MAX_INPUT_CHARS: ${HIVE_MAX_INPUT_CHARS:-120000}
      HIVE_MAX_OUTPUT_TOKENS: ${HIVE_MAX_OUTPUT_TOKENS:-128000}
    deploy:
      resources:
        limits:
          memory: ${AUTHORING_SERVICE_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No depends_on the orchestrator: they call each other over HTTP and each
    # degrades on its own when the other is down.
    depends_on:
      authoring-service-db:
        condition: service_healthy
    networks:
      - backend

  # CR-039 — the only service that talks to a language model. Hive and Ollama
  # are both called through the OpenAI SDK (Ollama via its /v1 endpoint). It
  # also runs the chunked code pipeline: layout/cast, shots in parallel, merge,
  # compile check (rendering), repair.
  llm-service:
    build: ./services/llm-service
    container_name: llm-service
    environment:
      HIVE_API_KEY: ${HIVE_API_KEY:-}
      HIVE_BASE_URL: ${HIVE_BASE_URL:-https://api-cdn.thehive.ai/api/v3}
      HIVE_MODEL: ${HIVE_MODEL:-deepseek-ai/deepseek-v4.1-flash}
      HIVE_TIMEOUT_SECONDS: ${HIVE_TIMEOUT_SECONDS:-0} # 0 = no timeout
      HIVE_MAX_RETRIES: ${HIVE_MAX_RETRIES:-3}
      HIVE_RATE_PER_SECOND: ${HIVE_RATE_PER_SECOND:-5} # Hive's documented default ceiling
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_TIMEOUT_SECONDS: "120"
      LIGHT_TASKS_PROVIDER: ${LIGHT_TASKS_PROVIDER:-ollama}
      CODE_CHUNK_SHOTS: ${CODE_CHUNK_SHOTS:-10}
      CODE_CHUNK_CONCURRENCY: ${CODE_CHUNK_CONCURRENCY:-3}
      CODE_REPAIR_MAX_ROUNDS: ${CODE_REPAIR_MAX_ROUNDS:-3}
      RENDERING_URL: http://rendering:8000
      RENDERING_CHECK_TIMEOUT_SECONDS: ${RENDERING_CHECK_TIMEOUT_SECONDS:-2100}
    deploy:
      resources:
        limits:
          memory: ${LLM_SERVICE_MEMORY_LIMIT:-256M}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    # A loaded model sits in RAM for the life of the container — llama3.2 (the
    # default model) needs a few GB. llm-service uses it for the light tasks
    # (suggest-metadata, suggest-short-script — LIGHT_TASKS_PROVIDER=ollama);
    # raise this if OLLAMA_MODEL is swapped for a larger one.
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-6G}
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # One-shot: pulls the model into the ollama_data volume on first startup
  # (idempotent — Ollama skips the download if it's already present).
  ollama-pull:
    image: curlimages/curl:8.10.1
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - "curl -s http://ollama:11434/api/pull -d '{\"name\":\"${OLLAMA_MODEL:-llama3.2}\"}'"
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - backend

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      ORCHESTRATOR_URL: http://orchestrator:8000
      AUTHORING_SERVICE_URL: http://authoring-service:8000
      PUBLISHER_URL: http://publisher:8000
      PORT: "8080"
      WEB_GUI_ORIGIN: http://localhost:3000
      SHARED_DIR: /shared
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: ${API_GATEWAY_MEMORY_LIMIT:-256M}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      authoring-service:
        condition: service_healthy
      publisher:
        condition: service_healthy
    volumes:
      - shared_artifacts:/shared
    networks:
      - backend

  web-gui:
    build:
      context: ./services/web-gui
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: web-gui
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: ${WEB_GUI_MEMORY_LIMIT:-128M}
    networks:
      - backend

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEMORY_LIMIT:-512M}
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: ${PROMTAIL_MEMORY_LIMIT:-256M}
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}
    networks:
      - backend

volumes:
  rabbitmq_data:
  # Video/clip/caption output. Defaults to a Docker-managed volume; set
  # VIDEO_OUTPUT_HOST_DIR in .env to bind-mount a host directory instead —
  # output can run large (rendered clips + assembled final videos), and a
  # host path is easier to prune/move/inspect than Docker's own volume
  # storage. Path must be an existing absolute directory on the host, or
  # `docker compose up` fails.
  shared_artifacts:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VIDEO_OUTPUT_HOST_DIR:-./data/shared_artifacts}
  tts_db_data:
  rendering_db_data:
  video_assembly_db_data:
  publisher_db_data:
  orchestrator_db_data:
  authoring_db_data:
  loki_data:
  grafana_data:
  ollama_data:

networks:
  backend:
    driver: bridge

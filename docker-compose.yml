services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "15672:15672" # Management UI (dev/debug only) — AMQP port 5672 intentionally NOT published to host
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  content-plugin-db:
    image: postgres:16-alpine
    container_name: content-plugin-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: content_plugin
    volumes:
      - content_plugin_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d content_plugin"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  content-plugin:
    build: ./services/content-plugin
    container_name: content-plugin
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@content-plugin-db:5432/content_plugin
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      content-plugin-db:
        condition: service_healthy
    networks:
      - backend

  tts-db:
    image: postgres:16-alpine
    container_name: tts-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: tts
    volumes:
      - tts_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d tts"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  tts:
    build: ./services/tts
    container_name: tts
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@tts-db:5432/tts
      # ADR-0023 — path to a Google service-account key INSIDE the container.
      # Leave GOOGLE_TTS_CREDENTIALS_FILE unset in .env and every voice uses the
      # Edge engine (ADR-0024), which needs no cloud account at all.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_TTS_CREDENTIALS_FILE:+/run/secrets/google-tts.json}
      # CR-011 — Azure AI Speech. Leave unset and the Azure voices in the
      # catalogue fall back to the identical Edge voice.
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      tts-db:
        condition: service_healthy
    volumes:
      - shared_artifacts:/shared
      # Mounted read-only; the variable defaults to /dev/null so compose still
      # validates when no key is configured.
      - ${GOOGLE_TTS_CREDENTIALS_FILE:-/dev/null}:/run/secrets/google-tts.json:ro
    networks:
      - backend

  script-processing-db:
    image: postgres:16-alpine
    container_name: script-processing-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: script_processing
    volumes:
      - script_processing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d script_processing"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  script-processing:
    build: ./services/script-processing
    container_name: script-processing
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@script-processing-db:5432/script_processing
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      script-processing-db:
        condition: service_healthy
    networks:
      - backend

  rendering-db:
    image: postgres:16-alpine
    container_name: rendering-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: rendering
    volumes:
      - rendering_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d rendering"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  rendering:
    build: ./services/rendering
    container_name: rendering
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@rendering-db:5432/rendering
      RENDER_TIMEOUT_SECONDS: "1800"
      RENDER_MEMORY_LIMIT_GB: "4"
      # Manim 0.18 keeps its cache inside media_dir, so this directory is
      # reused per project rather than being a throwaway tempdir. Set it to an
      # empty string to disable caching. Measured 21s -> 4s on an unchanged
      # re-render, 21s -> 6s after editing one narration line.
      RENDER_CACHE_ROOT: "/shared/.manim-media"
      # Fallback quality when a project does not specify one (CR-004). The
      # Creator picks per project in the GUI; this covers projects created
      # before that field existed.
      RENDER_QUALITY: "1080p60"
    # Manim renders on every core it can get (Phase 0 measured CPU-time at
    # 2.21x wall-clock), so without a cap a long render starves RabbitMQ and
    # the Postgres instances on the same host. 5G sits just above the 4 GiB
    # RLIMIT_AS the render subprocess is given.
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 5G
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      rendering-db:
        condition: service_healthy
    volumes:
      - shared_artifacts:/shared
    networks:
      - backend

  video-assembly-db:
    image: postgres:16-alpine
    container_name: video-assembly-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: video_assembly
    volumes:
      - video_assembly_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d video_assembly"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  video-assembly:
    build: ./services/video-assembly
    container_name: video-assembly
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@video-assembly-db:5432/video_assembly
      ASSEMBLY_TIMEOUT_SECONDS: "900"
      # CR-005 FR14.5 — silence before the first line and after the last.
      # Off by default: padding either end forces a full re-encode (tpad
      # repaints frames), and Phase 0 measured stream copy at 250x faster.
      ASSEMBLY_LEAD_IN_SECONDS: "0"
      ASSEMBLY_TAIL_SECONDS: "0"
    # x264 is even more parallel than Manim (Phase 0 measured 5.6x CPU-time
    # over wall-clock when burning subtitles), so it needs a cap for the same
    # reason. Peak RSS measured at ~1 GB.
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 3G
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      video-assembly-db:
        condition: service_healthy
    volumes:
      - shared_artifacts:/shared
    networks:
      - backend

  publisher-db:
    image: postgres:16-alpine
    container_name: publisher-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: publisher
    volumes:
      - publisher_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d publisher"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  publisher:
    build: ./services/publisher
    container_name: publisher
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@publisher-db:5432/publisher
      GOOGLE_OAUTH_CLIENT_SECRETS_DIR: /run/secrets/google-oauth
      # Legacy single-app fallback (CR-012 FR29.3) — used only when the
      # secrets directory holds no client_secret*.json.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      UPLOAD_TIMEOUT_SECONDS: "600"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      publisher-db:
        condition: service_healthy
    volumes:
      - shared_artifacts:/shared:ro
      # Read-only: the Publisher only ever reads client secrets, and a
      # compromised container must not be able to rewrite them (CR-012 FR35.2).
      - ./secrets:/run/secrets/google-oauth:ro
    networks:
      - backend

  orchestrator-db:
    image: postgres:16-alpine
    container_name: orchestrator-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: orchestrator
    volumes:
      - orchestrator_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  orchestrator:
    build: ./services/orchestrator
    container_name: orchestrator
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@orchestrator-db:5432/orchestrator
      OUTBOX_POLL_INTERVAL_MS: "500"
      DATABASE_MAX_CONNS: "10"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_TIMEOUT_SECONDS: "120"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      orchestrator-db:
        condition: service_healthy
    networks:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # One-shot: pulls the model into the ollama_data volume on first startup
  # (idempotent — Ollama skips the download if it's already present).
  ollama-pull:
    image: curlimages/curl:8.10.1
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - "curl -s http://ollama:11434/api/pull -d '{\"name\":\"${OLLAMA_MODEL:-llama3.2}\"}'"
    restart: "no"
    networks:
      - backend

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      ORCHESTRATOR_URL: http://orchestrator:8000
      CONTENT_PLUGIN_URL: http://content-plugin:8000
      PUBLISHER_URL: http://publisher:8000
      PORT: "8080"
      WEB_GUI_ORIGIN: http://localhost:3000
      SHARED_DIR: /shared
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      content-plugin:
        condition: service_healthy
      publisher:
        condition: service_healthy
    volumes:
      - shared_artifacts:/shared
    networks:
      - backend

  web-gui:
    build:
      context: ./services/web-gui
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: web-gui
    ports:
      - "3000:80"
    networks:
      - backend

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - loki
    networks:
      - backend

volumes:
  rabbitmq_data:
  shared_artifacts:
  content_plugin_db_data:
  tts_db_data:
  script_processing_db_data:
  rendering_db_data:
  video_assembly_db_data:
  publisher_db_data:
  orchestrator_db_data:
  loki_data:
  grafana_data:
  ollama_data:

networks:
  backend:
    driver: bridge

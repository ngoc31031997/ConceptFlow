server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Every response is revalidated (ETag) before the browser reuses it, so a
    # rebuilt image is picked up on the next page load instead of serving a
    # cached index.html that points at the previous bundle.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri /index.html;
    }
}
